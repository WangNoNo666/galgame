<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>好阳与涨云初 · 童话视觉小说</title>
<style>
:root{
  --xtbt:#a78bfa; --lzy:#4fc3f7; --ink:#e9e6f5; --dim:#a49dbd;
  --panel:rgba(17,14,28,.82); --edge:rgba(167,139,250,.35);
  --ui-font:"Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB","Noto Sans SC",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#05050a;color:var(--ink);font-family:var(--ui-font);overflow:hidden;
  -webkit-user-select:none;user-select:none;}
#app{position:fixed;inset:0}
#stage{position:absolute;inset:0;overflow:hidden;cursor:pointer}

/* ---------- 背景 ---------- */
.bg{position:absolute;inset:0;opacity:0;transition:opacity .42s ease;background-color:#0a0a12;background-repeat:no-repeat;background-size:cover}
.bg.on{opacity:1}

/* 走廊黄昏 */
.s-corridor{background-image:
  repeating-linear-gradient(90deg,rgba(255,208,150,.20) 0 7%,rgba(0,0,0,0) 7% 19%),
  linear-gradient(180deg,rgba(0,0,0,0) 0 74%,rgba(0,0,0,.45) 74% 100%),
  linear-gradient(180deg,#31243f 0%,#5b3a55 30%,#a0605c 52%,#e0a267 74%,#3b2b31 74%,#181119 100%);}
/* 本校机房·白天（队里的机房：三十台机器，桌面全是显示器） */
.s-machine_room{background-image:
  repeating-linear-gradient(90deg,rgba(150,205,255,.17) 0 4.2%,rgba(0,0,0,0) 4.2% 5.4%),
  repeating-linear-gradient(0deg,rgba(150,205,255,.10) 0 4%,rgba(0,0,0,0) 4% 4.8%),
  radial-gradient(120% 60% at 92% 18%,rgba(255,238,190,.42),rgba(0,0,0,0) 60%),
  linear-gradient(180deg,#26344c 0%,#38485f 42%,#77879a 63%,#3a4457 63%,#1c2431 100%);}
/* 本校机房·夜晚 */
.s-machine_room_night{background-image:
  repeating-linear-gradient(90deg,rgba(130,200,255,.28) 0 4.2%,rgba(0,0,0,0) 4.2% 5.4%),
  repeating-linear-gradient(0deg,rgba(130,200,255,.14) 0 4%,rgba(0,0,0,0) 4% 4.8%),
  radial-gradient(60% 40% at 20% 55%,rgba(110,160,255,.22),rgba(0,0,0,0) 70%),
  radial-gradient(60% 40% at 78% 48%,rgba(150,120,255,.20),rgba(0,0,0,0) 70%),
  linear-gradient(180deg,#101725 0%,#182238 42%,#232f47 63%,#131a28 63%,#080b12 100%);}
/* 集训宿舍·四人间·白天（上铺下桌，没有蚊帐） */
.s-dorm{background-image:
  repeating-linear-gradient(0deg,rgba(255,236,200,.10) 0 12%,rgba(0,0,0,0) 12% 24%),
  radial-gradient(90% 60% at 84% 20%,rgba(255,240,200,.34),rgba(0,0,0,0) 62%),
  linear-gradient(180deg,#39445c 0%,#3d4a63 34%,#5e6b84 55%,#7d7466 62%,#3a3630 100%);}
/* 集训宿舍·熄灯之后（被窝里的手电） */
.s-dorm_night{background-image:
  radial-gradient(34% 26% at 26% 50%,rgba(160,200,255,.22),rgba(0,0,0,0) 72%),
  radial-gradient(30% 24% at 72% 44%,rgba(120,150,255,.16),rgba(0,0,0,0) 74%),
  linear-gradient(180deg,#0d111c 0%,#141a28 36%,#1b2130 58%,#241f1a 64%,#0a0a0e 100%);}
/* 宿舍走廊 / 水房 · 夜 */
.s-hall{background-image:
  radial-gradient(30% 40% at 50% 16%,rgba(255,225,170,.30),rgba(0,0,0,0) 72%),
  repeating-linear-gradient(90deg,rgba(255,225,170,.07) 0 8%,rgba(0,0,0,0) 8% 26%),
  linear-gradient(180deg,#1a1f2c 0%,#2a3140 42%,#3a4152 60%,#22262f 60%,#12141a 100%);}
/* 井边·清晨 */
.s-well{background-image:
  radial-gradient(60% 40% at 50% 76%,rgba(120,180,190,.28),rgba(0,0,0,0) 70%),
  linear-gradient(180deg,#9fc4d4 0%,#c8dbe0 34%,#e8e2cf 52%,#8e8a72 70%,#4c4a3c 100%);}
/* 干裂的田·白天 */
.s-field{background-image:
  repeating-linear-gradient(74deg,rgba(70,50,30,.16) 0 3px,rgba(0,0,0,0) 3px 26px),
  repeating-linear-gradient(-64deg,rgba(70,50,30,.13) 0 2px,rgba(0,0,0,0) 2px 34px),
  linear-gradient(180deg,#cfe0e8 0%,#e6dcc0 38%,#c8a86a 62%,#8a6c42 100%);}
/* 山坡·黄昏 */
.s-hill{background-image:
  radial-gradient(70% 46% at 70% 30%,rgba(255,214,150,.5),rgba(0,0,0,0) 68%),
  linear-gradient(180deg,#f3c98f 0%,#e8a97a 34%,#a8778a 56%,#5c4a63 74%,#2a2436 100%);}
/* 云上·白天 */
.s-sky{background-image:
  radial-gradient(60% 30% at 26% 68%,rgba(255,255,255,.9),rgba(255,255,255,0) 72%),
  radial-gradient(56% 28% at 76% 78%,rgba(255,255,255,.85),rgba(255,255,255,0) 74%),
  linear-gradient(180deg,#4f86c8 0%,#79aede 40%,#a9cdec 66%,#dcecf8 100%);}
/* 雷雨 */
.s-storm{background-image:
  radial-gradient(36% 30% at 62% 22%,rgba(220,235,255,.34),rgba(0,0,0,0) 70%),
  linear-gradient(180deg,#1e2437 0%,#2c3550 36%,#3d4763 58%,#2a2f42 76%,#14161f 100%);}
/* 镇子·夜 */
.s-village{background-image:
  radial-gradient(20% 14% at 22% 70%,rgba(255,196,110,.55),rgba(0,0,0,0) 72%),
  radial-gradient(18% 12% at 62% 74%,rgba(255,186,96,.5),rgba(0,0,0,0) 72%),
  radial-gradient(16% 11% at 84% 68%,rgba(255,205,130,.45),rgba(0,0,0,0) 74%),
  linear-gradient(180deg,#0d1224 0%,#1a2138 40%,#2b2a34 62%,#191a22 100%);}
/* 高中部空教室·初二暑假的临时机房（没有台式机，桌上全是笔记本） */
.s-classroom{background-image:
  linear-gradient(180deg,rgba(255,255,255,.06) 0 1.2%,rgba(0,0,0,0) 1.2%),
  repeating-linear-gradient(90deg,rgba(255,238,190,.20) 0 5.2%,rgba(0,0,0,0) 5.2% 16%),
  repeating-linear-gradient(0deg,rgba(120,200,255,.20) 0 3.2%,rgba(0,0,0,0) 3.2% 7.4%),
  linear-gradient(180deg,rgba(0,0,0,0) 0 41%,rgba(0,0,0,.32) 41% 43.5%,rgba(0,0,0,0) 43.5% 46%,rgba(0,0,0,.22) 46% 47.5%,rgba(0,0,0,0) 47.5%),
  linear-gradient(180deg,#4e6360 0%,#3f5254 26%,#8e94a2 46%,#847a5f 47%,#5c5342 62%,#221d1a 100%);}
/* 同一间空教室·夜晚（笔记本屏幕亮着，空调还是 26 度） */
.s-classroom_night{background-image:
  linear-gradient(180deg,rgba(0,0,0,.30) 0 1.2%,rgba(0,0,0,0) 1.2%),
  repeating-linear-gradient(90deg,rgba(150,200,255,.09) 0 5.2%,rgba(0,0,0,0) 5.2% 16%),
  repeating-linear-gradient(0deg,rgba(130,200,255,.30) 0 3.2%,rgba(0,0,0,0) 3.2% 7.4%),
  radial-gradient(60% 40% at 30% 44%,rgba(110,160,255,.16),rgba(0,0,0,0) 70%),
  radial-gradient(50% 36% at 76% 46%,rgba(150,120,255,.14),rgba(0,0,0,0) 72%),
  linear-gradient(180deg,rgba(0,0,0,0) 0 41%,rgba(0,0,0,.34) 41% 43.5%,rgba(0,0,0,0) 43.5% 46%,rgba(0,0,0,.26) 46% 47.5%,rgba(0,0,0,0) 47.5%),
  linear-gradient(180deg,#1a2230 0%,#16202c 26%,#2b3444 46%,#2a2620 47%,#181513 62%,#08090c 100%);}
/* 停电 */
.s-blackout{background-image:
  radial-gradient(50% 40% at 86% 42%,rgba(255,170,80,.30),rgba(0,0,0,0) 70%),
  repeating-linear-gradient(90deg,rgba(255,170,90,.05) 0 4.2%,rgba(0,0,0,0) 4.2% 5.4%),
  linear-gradient(180deg,#05060a 0%,#0b0e16 55%,#121722 63%,#05070b 100%);}
/* 天台·夏夜 */
.s-roof{background-image:
  radial-gradient(140% 70% at 50% 96%,rgba(255,150,80,.30),rgba(0,0,0,0) 55%),
  radial-gradient(60% 30% at 78% 82%,rgba(255,120,90,.16),rgba(0,0,0,0) 70%),
  linear-gradient(180deg,#070a1c 0%,#101a3c 42%,#26335c 68%,#1a1a2c 68%,#0a0a12 100%);}
/* 天台·雪夜 */
.s-roof_snow{background-image:
  radial-gradient(120% 60% at 50% 100%,rgba(150,190,255,.22),rgba(0,0,0,0) 60%),
  linear-gradient(180deg,#05070f 0%,#0d1430 45%,#1d2749 70%,#141a2c 70%,#080a11 100%);}
/* 赛场 */
.s-contest{background-image:
  radial-gradient(circle at 12% 62%,rgba(255,90,120,.55) 0 2.6%,rgba(0,0,0,0) 3.4%),
  radial-gradient(circle at 27% 58%,rgba(255,210,90,.50) 0 2.4%,rgba(0,0,0,0) 3.2%),
  radial-gradient(circle at 43% 64%,rgba(120,230,160,.45) 0 2.4%,rgba(0,0,0,0) 3.2%),
  radial-gradient(circle at 68% 60%,rgba(140,170,255,.45) 0 2.4%,rgba(0,0,0,0) 3.2%),
  radial-gradient(circle at 84% 66%,rgba(255,120,220,.40) 0 2.4%,rgba(0,0,0,0) 3.2%),
  radial-gradient(120% 50% at 50% 0%,rgba(255,255,255,.16),rgba(0,0,0,0) 60%),
  linear-gradient(180deg,#1a1a24 0%,#2a2a38 38%,#3a3a4c 60%,#22222e 60%,#111118 100%);}
/* 街道夜 */
.s-street{background-image:
  radial-gradient(30% 55% at 16% 60%,rgba(255,196,120,.45),rgba(0,0,0,0) 70%),
  radial-gradient(30% 55% at 82% 58%,rgba(255,196,120,.38),rgba(0,0,0,0) 70%),
  linear-gradient(180deg,#070912 0%,#111a2e 45%,#2a3247 64%,#1b2030 64%,#0a0c14 100%);}

#fx{position:absolute;inset:0;overflow:hidden;pointer-events:none}
#fx span{position:absolute;border-radius:50%}
.fx-star{background:#fff;animation:tw 3.4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.8)}50%{opacity:.95;transform:scale(1.15)}}
.fx-snow{background:#fff;animation:fall linear infinite}
@keyframes fall{0%{transform:translate3d(0,-12vh,0)}100%{transform:translate3d(28px,112vh,0)}}
#vignette{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 45%,rgba(0,0,0,0) 40%,rgba(0,0,0,.55) 100%)}

/* ---------- 立绘 ---------- */
#sprites{position:absolute;inset:0;pointer-events:none;transition:transform .4s cubic-bezier(.22,.9,.28,1)}
#sprites.chatting{transform:translateX(-5%) scale(.95);transform-origin:50% 100%}
.sprite{position:absolute;bottom:-1.5%;height:82%;display:flex;align-items:flex-end;
  opacity:0;transition:opacity .38s ease,transform .45s cubic-bezier(.22,.9,.28,1),left .45s cubic-bezier(.22,.9,.28,1),right .45s cubic-bezier(.22,.9,.28,1);
  filter:drop-shadow(0 14px 34px rgba(0,0,0,.6))}
.sprite.on{opacity:1}
.sprite svg{height:100%;width:auto;display:block}
.sprite[data-slot="left"]{left:3%}
.sprite[data-slot="mid"]{left:50%;transform:translateX(-50%)}
.sprite[data-slot="right"]{right:3%}
.sprite.dim svg{filter:brightness(.6) saturate(.72) blur(.4px)}
.sprite.solo{left:50%;right:auto;transform:translateX(-50%) scale(1.06)}
#sprites.chatting .sprite.on{opacity:.45}
.sprite[data-who="mzt"]{height:92%}   /* 他比 XTBT 高一头 */

/* ---------- QQ 聊天窗 ---------- */
#chat{position:absolute;right:2vw;top:11%;width:min(330px,34vw);max-height:66vh;display:flex;flex-direction:column;
  background:linear-gradient(180deg,rgba(20,18,34,.95),rgba(11,10,20,.97));
  border:1px solid rgba(120,180,255,.3);border-radius:14px;overflow:hidden;
  box-shadow:0 18px 46px rgba(0,0,0,.62),0 0 0 1px rgba(255,255,255,.04) inset;
  opacity:0;transform:translateY(12px) scale(.98);transition:.32s cubic-bezier(.22,.9,.28,1);pointer-events:none}
#chat.on{opacity:1;transform:none}
#chatHead{display:flex;align-items:center;gap:8px;padding:9px 12px;background:rgba(255,255,255,.055);
  border-bottom:1px solid rgba(255,255,255,.08);font-size:12.8px;letter-spacing:.04em}
#chatHead .dot{width:7px;height:7px;border-radius:50%;background:#5ee08a;box-shadow:0 0 9px #5ee08a;flex:0 0 7px}
#chatHead .who{color:#dfe8ff}
#chatBody{padding:11px 12px 6px;overflow:auto;display:flex;flex-direction:column;gap:9px;flex:1;
  background:radial-gradient(120% 70% at 50% 0%,rgba(80,120,255,.07),transparent 62%)}
#chatFoot{padding:5px 12px 9px;text-align:right;font-size:11.5px;color:#8d86a8;animation:bob 1.5s ease-in-out infinite}
.qmsg{display:flex;gap:7px;align-items:flex-end;max-width:100%}
.qmsg .av{width:22px;height:22px;border-radius:50%;flex:0 0 22px;display:grid;place-items:center;
  font-size:11px;color:#0b0b14;font-weight:800;overflow:hidden}
.qmsg .av svg{width:100%;height:100%;display:block}
.av-pixel{background-color:#eef8ee;
  background-image:
    linear-gradient(45deg,#7cc47c 25%,transparent 25%,transparent 75%,#7cc47c 75%),
    linear-gradient(45deg,#7cc47c 25%,transparent 25%,transparent 75%,#7cc47c 75%);
  background-size:8px 8px;background-position:0 0,4px 4px}
.qmsg .col{display:flex;flex-direction:column;gap:3px;max-width:100%}
.qname{font-size:10.5px;color:#9a93b8;padding-left:3px;letter-spacing:.04em}
.qmsg.right .col{align-items:flex-end}
.qmsg .bub{padding:7px 11px;border-radius:12px;font-size:13.5px;line-height:1.7;max-width:225px;
  word-break:break-word;white-space:pre-wrap}
.qmsg.left .bub{background:rgba(255,255,255,.10);border-top-left-radius:4px}
.qmsg.right{flex-direction:row-reverse}
.qmsg.right .bub{background:linear-gradient(120deg,#5b7cff,#7b5bff);border-top-right-radius:4px;color:#fff}
.qmsg.sys{justify-content:center}
.qmsg.sys .bub{background:none;color:#8d86a8;font-size:11.5px;padding:1px 0}
.qtip{display:flex;gap:4px;align-items:center;padding:9px 12px;background:rgba(255,255,255,.08);
  border-radius:12px;border-top-left-radius:4px}
.qtip i{width:5px;height:5px;border-radius:50%;background:#b9b2d4;animation:qt 1.1s infinite}
.qtip i:nth-child(2){animation-delay:.15s}
.qtip i:nth-child(3){animation-delay:.3s}
@keyframes qt{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

/* ---------- 章节卡 ---------- */
#chap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;opacity:0;transition:opacity .5s ease;pointer-events:none;
  background:radial-gradient(80% 60% at 50% 50%,rgba(8,6,16,.72),rgba(8,6,16,.2))}
#chap.on{opacity:1}
#chapNum{font-size:clamp(13px,1.5vw,17px);letter-spacing:.5em;color:var(--dim)}
#chapTitle{font-size:clamp(28px,4.4vw,54px);font-weight:700;letter-spacing:.12em;
  background:linear-gradient(100deg,#fff,#c9b8ff 45%,#8fd8ff);-webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 60px rgba(150,130,255,.45)}

/* ---------- HUD ---------- */
#hud{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:12px;padding:10px 14px;
  background:linear-gradient(180deg,rgba(5,5,12,.72),rgba(5,5,12,0));font-size:12.5px}
#chapterTag{color:var(--dim);letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:30vw}
#affBox{display:flex;align-items:center;gap:6px;margin-left:auto;color:#ff9fc0}
#affBar{width:76px;height:6px;border-radius:99px;background:rgba(255,255,255,.16);overflow:hidden}
#affBar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#ff8fb0,#ff5f8d);transition:width .45s ease}
#btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
#btns button,.btn{font-family:inherit;font-size:12.5px;color:var(--ink);background:rgba(28,22,44,.72);
  border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:5px 10px;cursor:pointer;transition:.18s}
#btns button:hover,.btn:hover{background:rgba(60,48,96,.9);border-color:var(--edge)}
#btns button.active{background:rgba(110,80,190,.85);border-color:#c9b8ff;color:#fff}

/* ---------- 对话框 ---------- */
#dlg{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);width:min(1080px,94vw);
  background:linear-gradient(180deg,rgba(20,16,34,.86),rgba(12,10,22,.92));
  border:1px solid rgba(167,139,250,.28);border-radius:16px;padding:20px 26px 26px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  box-shadow:0 18px 50px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.04) inset;
  transition:opacity .3s ease,transform .3s ease}
#dlg.hidden{opacity:0;transform:translateX(-50%) translateY(14px);pointer-events:none}
#nameRow{display:flex;align-items:baseline;gap:10px;margin-bottom:8px;min-height:22px}
#name{font-size:17px;font-weight:700;letter-spacing:.06em;color:var(--lzy)}
#tag{font-size:11.5px;color:var(--dim);letter-spacing:.14em}
#text{font-size:clamp(15px,1.55vw,19.5px);line-height:1.95;min-height:5.8em;white-space:pre-wrap;
  letter-spacing:.02em;text-shadow:0 2px 10px rgba(0,0,0,.6)}
#dlg.narr #text{color:#d7d3e8}
#dlg.narr #name{display:none}
#dlg.inner{background:linear-gradient(180deg,rgba(24,20,46,.88),rgba(14,12,30,.94));
  border-color:rgba(120,180,255,.3)}
#dlg.inner #name{color:#8fd0ff;font-style:italic}
#dlg.inner #text{font-style:italic;color:#cfe4ff}
#cont{position:absolute;right:18px;bottom:8px;font-size:13px;color:var(--dim);animation:bob 1.5s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0);opacity:.4}50%{transform:translateY(4px);opacity:1}}

/* ---------- 选项 ---------- */
#choices{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;gap:12px;
  width:min(760px,86vw);z-index:6}
#choices.hidden{display:none}
.chq{text-align:center;color:#e5dfff;font-size:14.5px;letter-spacing:.1em;margin-bottom:4px;
  text-shadow:0 2px 12px #000}
.chbtn{position:relative;font-family:inherit;font-size:clamp(14px,1.6vw,17px);color:#f2eeff;text-align:left;
  background:linear-gradient(100deg,rgba(38,28,66,.92),rgba(22,18,42,.92));
  border:1px solid rgba(167,139,250,.45);border-radius:13px;padding:15px 20px 15px 46px;cursor:pointer;
  transition:.2s;box-shadow:0 10px 26px rgba(0,0,0,.45)}
.chbtn::before{content:"♥";position:absolute;left:18px;top:50%;transform:translateY(-50%);color:#ff9fc0;opacity:.5;transition:.2s}
.chbtn:hover{background:linear-gradient(100deg,rgba(76,56,132,.96),rgba(40,32,72,.96));transform:translateX(6px);
  border-color:#d6c6ff;box-shadow:0 12px 34px rgba(120,90,220,.35)}
.chbtn:hover::before{opacity:1;transform:translateY(-50%) scale(1.25)}

/* ---------- 洛谷个人主页卡 / 榜单 ---------- */
#card{position:absolute;left:50%;top:8%;transform:translate(-50%,0) scale(.97);width:min(440px,90vw);
  background:linear-gradient(180deg,rgba(18,16,30,.97),rgba(10,10,18,.98));
  border:1px solid rgba(150,170,255,.3);border-radius:14px;overflow:hidden;
  box-shadow:0 18px 46px rgba(0,0,0,.66);opacity:0;pointer-events:none;
  transition:.3s cubic-bezier(.22,.9,.28,1);z-index:5}
#card.on{opacity:1;transform:translate(-50%,0) scale(1)}
#cardHead{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;font-size:12.5px;
  color:#cfd7ff;background:rgba(255,255,255,.05);border-bottom:1px solid rgba(255,255,255,.08)}
#cardBody{padding:12px 14px;font-size:13.5px;line-height:1.85;color:#ddd8f0}
.lgTop{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.lgAv{width:58px;height:58px;border-radius:12px;flex:0 0 58px;overflow:hidden;background:#eef0f6;
  border:1px solid rgba(255,255,255,.18)}
.lgAv svg{width:100%;height:100%;display:block}
.lgName{font-size:19px;font-weight:800;color:#f2efff;letter-spacing:.02em}

/* =======================================================================
   表情 → SVG 立绘
   ======================================================================= */
const EXPR = {
  calm:    {eye:'open',    brow:'flat',  mouth:'line',   blush:.08},
  smile:   {eye:'arc',     brow:'soft',  mouth:'curve',  blush:.20},
  laugh:   {eye:'arc',     brow:'soft',  mouth:'laugh',  blush:.30},
  blush:   {eye:'wide',    brow:'up',    mouth:'tiny',   blush:.62},
  shy:     {eye:'down',    brow:'sad',   mouth:'wave',   blush:.72},
  smug:    {eye:'half',    brow:'cock',  mouth:'smirk',  blush:.12},
  sad:     {eye:'down',    brow:'sad',   mouth:'frown',  blush:.06},
  serious: {eye:'sharp',   brow:'angry', mouth:'line',   blush:0},
  cry:     {eye:'cry',     brow:'sad',   mouth:'cryo',   blush:.40},
  surprise:{eye:'wide',    brow:'up',    mouth:'o',      blush:.18}
};

function irisSVG(cfg, dy){
  return '<ellipse rx="11" ry="13" fill="'+cfg.iris+'" opacity=".95" transform="translate(1,'+dy+')"/>'
    + '<ellipse rx="5.6" ry="6.6" fill="#241a33" transform="translate(1,'+(dy+1)+')"/>'
    + '<circle cx="-2.6" cy="'+(dy-4.5)+'" r="3.4" fill="#fff" opacity=".95"/>'
    + '<circle cx="4" cy="'+(dy+5)+'" r="1.7" fill="#fff" opacity=".62"/>';
}

function eyeSVG(cfg, E, side){
  const dark='#3b2a4e', white='#fffdfa', skin=cfg.skin;
  let out='';
  switch(E.eye){
    case 'open':
      out='<ellipse rx="15" ry="17" fill="'+white+'"/>'+irisSVG(cfg,0)
        +'<path d="M-16,-9 Q0,-24 15,-7" stroke="'+dark+'" stroke-width="4.6" fill="none" stroke-linecap="round"/>';
      break;
    case 'wide':
      out='<ellipse rx="15.5" ry="19" fill="'+white+'"/>'+irisSVG(cfg,1)
        +'<path d="M-16,-11 Q0,-27 15,-9" stroke="'+dark+'" stroke-width="4.2" fill="none" stroke-linecap="round"/>'
        +'<path d="M-11,14 Q0,18 12,13" stroke="'+dark+'" stroke-width="2.4" fill="none" opacity=".55" stroke-linecap="round"/>';
      break;
    case 'half':
      out='<ellipse rx="15" ry="17" fill="'+white+'"/>'+irisSVG(cfg,2)
        +'<path d="M-18,-1 L18,-1 L18,-26 L-18,-26 Z" fill="'+skin+'"/>'
        +'<path d="M-16,-2 Q0,-18 15,-1" stroke="'+dark+'" stroke-width="4.6" fill="none" stroke-linecap="round"/>';
      break;
    case 'down':
      out='<ellipse rx="15" ry="17" fill="'+white+'"/>'+irisSVG(cfg,5)
        +'<path d="M-18,1 L18,1 L18,-26 L-18,-26 Z" fill="'+skin+'"/>'
        +'<path d="M-16,0 Q0,-13 15,1" stroke="'+dark+'" stroke-width="4.4" fill="none" stroke-linecap="round"/>';
      break;
    case 'sharp':
      out='<ellipse rx="15" ry="12" fill="'+white+'"/>'
        +'<ellipse rx="10.6" ry="9.6" fill="'+cfg.iris+'" opacity=".95" transform="translate(1,-1)"/>'
        +'<ellipse rx="5" ry="5.4" fill="#241a33" transform="translate(1,0)"/>'
        +'<circle cx="-2.6" cy="-4" r="3" fill="#fff" opacity=".9"/>'
        +'<path d="M-16,-7 Q2,-19 15,-3" stroke="'+dark+'" stroke-width="4.8" fill="none" stroke-linecap="round"/>';
      break;
    case 'arc':
      out='<path d="M-15,3 Q0,-14 15,3" stroke="'+dark+'" stroke-width="5" fill="none" stroke-linecap="round"/>';
      break;
    case 'cry':
      out='<path d="M-15,-2 Q0,11 15,-2" stroke="'+dark+'" stroke-width="4.6" fill="none" stroke-linecap="round"/>'
        +'<path d="M2,9 C-3,19 -2,26 2,27 C7,28 8,19 4,11 Z" fill="#8ed8ff" opacity=".85"/>';
      break;
    default:
      out='<ellipse rx="15" ry="17" fill="'+white+'"/>'+irisSVG(cfg,0);
  }
  const bmap={
    flat :'M-17,-30 Q0,-34 17,-30',
    soft :'M-17,-32 Q0,-37 17,-30',
    up   :'M-17,-34 Q0,-42 17,-33',
    sad  :'M-17,-37 Q0,-35 17,-28',
    angry:'M-17,-27 Q0,-33 17,-36',
    cock : side===0 ? 'M-17,-35 Q0,-41 17,-32' : 'M-17,-29 Q0,-32 17,-29'
  };
  out+='<path d="'+(bmap[E.brow]||bmap.flat)+'" stroke="'+dark+'" stroke-width="4" fill="none" stroke-linecap="round"/>';
  return out;
}

function mouthSVG(E){
  const dark='#5c3244';
  switch(E.mouth){
    case 'curve': return '<path d="M-9,-1 Q0,8 9,-1" stroke="'+dark+'" stroke-width="3.6" fill="none" stroke-linecap="round"/>';
    case 'laugh': return '<path d="M-11,-1 Q0,16 11,-1 Q0,5 -11,-1 Z" fill="'+dark+'"/>'
      +'<path d="M-6,4 Q0,11 6,4 Z" fill="#e08a9a"/>';
    case 'tiny':  return '<path d="M-4,1 Q0,6 4,1" stroke="'+dark+'" stroke-width="3.2" fill="none" stroke-linecap="round"/>';
    case 'wave':  return '<path d="M-9,2 Q-4.5,-4 0,1 Q4.5,6 9,0" stroke="'+dark+'" stroke-width="3.2" fill="none" stroke-linecap="round"/>';
    case 'smirk': return '<path d="M-10,-2 Q2,9 12,-4" stroke="'+dark+'" stroke-width="3.4" fill="none" stroke-linecap="round"/>';
    case 'frown': return '<path d="M-9,5 Q0,-4 9,5" stroke="'+dark+'" stroke-width="3.4" fill="none" stroke-linecap="round"/>';
    case 'o':     return '<ellipse rx="4.6" ry="6" fill="#6b3a48"/>';
    case 'cryo':  return '<ellipse rx="6.5" ry="8.5" fill="#5a2d3c"/>';
    default:      return '<path d="M-8,0 H8" stroke="'+dark+'" stroke-width="3.4" fill="none" stroke-linecap="round"/>';
  }
}

function starSVG(x,y,s,fill){
  return '<path transform="translate('+x+','+y+') scale('+s+')" fill="'+fill+'" d="M0,-9 L2.6,-2.8 L9,-2.8 L3.9,1 L5.9,7 L0,3.4 L-5.9,7 L-3.9,1 L-9,-2.8 L-2.6,-2.8 Z"/>';
}

<script>
/* =======================================================================

(function(){
  const $ = function(s){ return document.querySelector(s); };
  const LABELS = {};
  STORY.forEach(function(c,i){ if(c[0]==='LB') LABELS[c[1]]=i; });

  const ENDINGS = {
    true:{ key:'true', title:'ENDING · 下雨了', sub:'他把桶举起来的时候，第一滴雨落在他脸上。' },
    warm:{ key:'warm', title:'ENDING · 也是下雨了', sub:'话说得晚了一点，雨还是准时下了。' }
  };
  const MAXAFF = 14;
  const LS_PROG = 'xtbtlzy.progress.v1';
  const LS_SAVE = 'xtbtlzy.slot.';
  const LS_CFG  = 'xtbtlzy.cfg.v1';

  const g = {
    pc:0, aff:0, flags:{}, hist:[], pos:{left:null,mid:null,right:null},
    curBg:'', bgT:null, typing:false, typeT:null, auto:false, skip:false,
    choice:false, lock:false, chapter:'序章', ending:null, started:false, save:null, noCard:false,
    chatOpen:false, chatWho:null, chatLog:[], tipRow:null, cardOpen:false
  };
  const SLOTS = ['left','mid','right'];
  let topLayer = null;

  /* ---------- 存档配置 ---------- */
  let cfg = { speed:48, sfx:true };
  try{ const c=JSON.parse(localStorage.getItem(LS_CFG)||'null'); if(c) cfg=Object.assign(cfg,c); }catch(e){}
  function saveCfg(){ try{ localStorage.setItem(LS_CFG, JSON.stringify(cfg)); }catch(e){} }
  function progress(){
    try{ return JSON.parse(localStorage.getItem(LS_PROG)||'null') || {unlocked:[],best:0,bonus:false}; }
    catch(e){ return {unlocked:[],best:0,bonus:false}; }
  }
  function unlockEnding(k){
    const p=progress();
    if(p.unlocked.indexOf(k)<0) p.unlocked.push(k);
    if(g.aff>p.best) p.best=g.aff;
    if(g.aff>=16) p.bonus=true;
    try{ localStorage.setItem(LS_PROG, JSON.stringify(p)); }catch(e){}
  }

  /* ---------- 音效（极简合成音） ---------- */
  let AC=null;
  function blip(freq,dur,vol){
    if(!cfg.sfx) return;
    try{
      AC = AC || new (window.AudioContext||window.webkitAudioContext)();
      const o=AC.createOscillator(), gn=AC.createGain();
      o.type='triangle'; o.frequency.value=freq||620;
      gn.gain.value=vol||0.03;
      o.connect(gn); gn.connect(AC.destination);
      const t=AC.currentTime; o.start(t);
      gn.gain.exponentialRampToValueAtTime(0.0008,t+(dur||0.06));
      o.stop(t+(dur||0.06)+0.02);
    }catch(e){}
  }

  /* ---------- 背景 ---------- */
  function setBG(name){
    if(g.curBg===name) return;
    g.curBg=name;
    const el=$('#bg');
    el.classList.remove('on');
    clearTimeout(g.bgT);
    g.bgT=setTimeout(function(){
      el.className='bg s-'+name;
      void el.offsetWidth;
      el.classList.add('on');
    },300);
  }
  /* ---------- 粒子层 ---------- */
  function setFX(kind){
    const fx=$('#fx'); fx.innerHTML='';
    if(!kind) return;
    const n = kind==='stars'?70:52;
    for(let i=0;i<n;i++){
      const s=document.createElement('span');
      if(kind==='stars'){
        const sz=(Math.random()*1.9+0.9).toFixed(2);
        s.className='fx-star';
        s.style.width=sz+'px'; s.style.height=sz+'px';
        s.style.left=(Math.random()*100).toFixed(2)+'%';
        s.style.top=(Math.random()*62).toFixed(2)+'%';
        s.style.animationDelay=(Math.random()*3.4).toFixed(2)+'s';
        s.style.animationDuration=(2.4+Math.random()*2.6).toFixed(2)+'s';
      }else{
        const sz=(Math.random()*2.6+1.4).toFixed(2);
        s.className='fx-snow';
        s.style.width=sz+'px'; s.style.height=sz+'px';
        s.style.left=(Math.random()*100).toFixed(2)+'%';
        s.style.opacity=(0.35+Math.random()*0.6).toFixed(2);
        s.style.animationDuration=(7+Math.random()*9).toFixed(2)+'s';
        s.style.animationDelay=(-Math.random()*12).toFixed(2)+'s';
      }
      fx.appendChild(s);
    }
  }
  /* ---------- 立绘 ---------- */
  function renderSprites(){
    SLOTS.forEach(function(slot){
      const el=document.querySelector('.sprite[data-slot="'+slot+'"]');
      const d=g.pos[slot];
      if(!d){ el.classList.remove('on','dim','solo'); el.innerHTML=''; return; }
      el.innerHTML=spriteSVG(d.who,d.expr);
      el.dataset.who=d.who;
      el.classList.add('on');
      el.classList.toggle('solo', !SLOTS.some(function(s){ return s!==slot && g.pos[s]; }));
      const speaker=g.speaker;
      const onScreen = !!speaker && SLOTS.some(function(s){ return g.pos[s] && g.pos[s].who===speaker; });
      el.classList.toggle('dim', onScreen && speaker!==d.who);
    });
  }
  function show(who,slot,expr){
    if(slot==='auto') slot = SLOTS.find(function(s){ return !g.pos[s]; }) || 'left';
    g.pos[slot]={who:who,expr:expr};
    renderSprites();
  }
  function hide(who){
    SLOTS.forEach(function(s){ if(g.pos[s] && g.pos[s].who===who) g.pos[s]=null; });
    renderSprites();
  }
  function expr(who,e){
    SLOTS.forEach(function(s){ if(g.pos[s] && g.pos[s].who===who) g.pos[s].expr=e; });
    renderSprites();
  }

  /* ---------- QQ 聊天窗 ---------- */
  function chatAvatar(who){
    const a=document.createElement('span');
    a.className='av';
    if(who==='lzy'){                       /* 洛谷随机默认头像：绿白像素风 */

      a.title='lzy 的头像';
    }else if(who==='xtbt'){                /* 玩偶熊 */

      a.innerHTML='<svg viewBox="0 0 24 24"><circle cx="7" cy="7.5" r="4" fill="#c99a63"/>'
        +'<circle cx="17" cy="7.5" r="4" fill="#c99a63"/>'
        +'<circle cx="12" cy="13" r="8.2" fill="#d8ad76"/>'
        +'<circle cx="9.3" cy="12" r="1.35" fill="#4a3a26"/>'
        +'<circle cx="14.7" cy="12" r="1.35" fill="#4a3a26"/>'
        +'<ellipse cx="12" cy="15.8" rx="2.3" ry="1.8" fill="#f2ddc0"/>'
        +'<ellipse cx="12" cy="14.9" rx="1.05" ry="0.85" fill="#4a3a26"/></svg>';
      a.title='XTBT 的头像';
    }else{
      a.style.background=COLS[who]||'#9aa4b2';
      a.textContent=(NAMES[who]||'?').slice(0,1);
    }
    return a;
  }

  /* ---------- HUD / 提示 ---------- */
  function setAff(v,delta){

  let toastT=null;
  function toast(msg){
    const t=$('#toast'); t.textContent=msg; t.classList.add('on');
    clearTimeout(toastT); toastT=setTimeout(function(){ t.classList.remove('on'); },1400);
  }
  function setChapter(txt){ g.chapter=txt; $('#chapterTag').textContent=txt; }

  /* ---------- 对话 ---------- */
  let autoT=null;
  function showLine(cmd){
    const kind=cmd[0];
    const dlg=$('#dlg'); dlg.classList.remove('hidden');
    dlg.classList.toggle('narr',kind==='N');
    dlg.classList.toggle('inner',kind==='I');
    g.speaker = kind==='N' ? null : cmd[1];
    renderSprites();
    if(kind==='N'){
      $('#name').textContent=''; $('#tag').textContent='';
      log('', cmd[1], 'narr');
      typeText(cmd[1]);
    }else{
      const who=cmd[1], e=cmd[2], txt=cmd[3];
      $('#name').textContent=NAMES[who]||who;
      $('#name').style.color=COLS[who]||'#fff';
      $('#tag').textContent = kind==='I' ? '内心' : (CH[who]?CH[who].tag:'');
      if(kind==='S' && CH[who]) expr(who,e);
      log(kind==='I'?('（'+($('#name').textContent)+' 的心声）'):$('#name').textContent, txt, kind==='I'?'inner':'say');
      typeText(txt);
    }
  }
  function typeText(t){
    const el=$('#text');
    el.textContent='';
    if(g.skip){ el.textContent=t; g.typing=false; afterTyping(); return; }
    g.typing=true;
    const chars=Array.from(t);
    let i=0;
    clearInterval(g.typeT);
    const step=cfg.speed<=26?2:1;
    g.typeT=setInterval(function(){
      for(let k=0;k<step && i<chars.length;k++) el.textContent+=chars[i++];
      if(i>=chars.length){ clearInterval(g.typeT); g.typing=false; afterTyping(); }
    },cfg.speed);
  }
  function finishTyping(){
    clearInterval(g.typeT); g.typing=false;
    const cmd=STORY[g.pc];
    if(cmd){ const t = cmd[0]==='N'?cmd[1]:cmd[3]; $('#text').textContent=t||''; }
    afterTyping();
  }
  function afterTyping(){
    if(g.auto){ clearTimeout(autoT); autoT=setTimeout(function(){ if(g.auto&&!g.choice) advance(); }, 1100); }
    if(g.skip){ clearTimeout(autoT); autoT=setTimeout(function(){ if(g.skip&&!g.choice) advance(); }, 40); }
  }
  function log(name,text,kind){ g.hist.push({name:name,text:text,kind:kind}); if(g.hist.length>400) g.hist.shift(); }

  /* ---------- 主循环 ---------- */
  function step(){
    if(g.pc<0||g.pc>=STORY.length){ showEnding('true'); return; }
    const cmd=STORY[g.pc];
    switch(cmd[0]){
      case 'BG':   setBG(cmd[1]); g.pc++; return step();
      case 'FX':   setFX(cmd[1]); g.pc++; return step();
      case 'CH':   chapterCard(cmd[1],cmd[2]); return;
      case 'SHOW': show(cmd[1],cmd[2],cmd[3]); g.pc++; return step();
      case 'HIDE': hide(cmd[1]); g.pc++; return step();
      case 'EXPR': expr(cmd[1],cmd[2]); g.pc++; return step();
      case 'AFF':  setAff(g.aff+cmd[1],cmd[1]); g.pc++; return step();
      case 'SET':  g.flags[cmd[1]]=cmd[2]; g.pc++; return step();
      case 'QQ':   openChat(cmd[1]); g.pc++; return step();
      case 'Q':    showChat(cmd[1],cmd[2]); return;
      case 'QT':   typingTip(cmd[1]); g.pc++; return step();
      case 'QX':   closeChat(); g.pc++; return step();
      case 'PROF': showProfile(cmd[1],cmd[2]); g.pc++; return step();
      case 'RANKS':showRanks(cmd[1],cmd[2]); g.pc++; return step();
      case 'CARDX':closeCard(); g.pc++; return step();
      case 'LB':   g.pc++; return step();
      case 'GO':   jump(cmd[1]); return step();
      case 'IF':   jump(cond(cmd[1],cmd[2],cmd[3])?cmd[4]:cmd[5]); return step();
      case 'IFA':  jump(cond('aff',cmd[1],cmd[2])?cmd[3]:cmd[4]); return step();
      case 'CHOICE': showChoice(cmd[1],cmd[2]); return;
      case 'N': case 'S': case 'I': showLine(cmd); return;
      case 'END':  showEnding(cmd[1]); return;
      default: g.pc++; return step();
    }
  }
  function cond(key,op,v){
    const cur = key==='aff' ? g.aff : (g.flags[key]||0);
    if(op==='==') return cur===v;
    if(op==='>=') return cur>=v;
    if(op==='<')  return cur<v;
    if(op==='>')  return cur>v;
    return false;
  }
  function jump(label){
    const i=LABELS[label];
    if(i==null){ console.warn('missing label',label); g.pc=STORY.length; return; }
    g.pc=i;
  }
  function advance(){
    if(g.choice||g.lock||g.ending) return;
    if(g.typing){ finishTyping(); return; }
    g.pc++; step();
  }
  function chapterCard(num,title){
    setChapter(num+' · '+title);
    if(g.noCard){ g.pc++; return step(); }
    const el=$('#chap');
    $('#chapNum').textContent=num;
    $('#chapTitle').textContent=title;
    el.classList.add('on');
    g.lock=true;
    blip(520,0.12,0.025);
    setTimeout(function(){ el.classList.remove('on'); },1700);
    setTimeout(function(){ g.lock=false; g.pc++; step(); },1400);
  }
  function showChoice(q,opts){

    if(q){ const qq=document.createElement('div'); qq.className='chq'; qq.textContent=q; box.appendChild(qq); }

      b.className='chbtn';
      b.textContent=o[0];
      b.onclick=function(ev){

  /* ---------- 存档 ---------- */
  function doSave(slot){
    const data={ pc:g.pc, aff:g.aff, flags:g.flags, pos:g.pos, bg:g.curBg, chapter:g.chapter,
      chatOpen:g.chatOpen, chatWho:g.chatWho, chatLog:g.chatLog.slice(-40),
      hist:g.hist.slice(-60), t:Date.now() };
    try{ localStorage.setItem(LS_SAVE+slot, JSON.stringify(data)); }catch(err){}
    toast('已存档到 ' + slot);
    if($('#overlay').classList.contains('hidden')===false) openOverlay('save');
  }
  function doLoad(slot){
    let d=null;
    try{ d=JSON.parse(localStorage.getItem(LS_SAVE+slot)||'null'); }catch(e){}
    if(!d){ toast('该存档是空的'); return false; }
    g.pc=d.pc; g.aff=d.aff||0; g.flags=d.flags||{}; g.pos=d.pos||{left:null,mid:null,right:null};
    if(!('mid' in g.pos)) g.pos.mid=null;
    g.hist=d.hist||[]; g.chapter=d.chapter||'';
    g.chatOpen=!!d.chatOpen; g.chatWho=d.chatWho||null; g.chatLog=d.chatLog||[]; g.tipRow=null;
    setChapter(g.chapter||'　');
    setAff(g.aff);
    g.curBg=null; setBG(d.bg||'classroom');
    renderSprites();
    /* 聊天窗按记录重建；当前这一句如果是消息，去掉末尾一条避免重复播放 */
    if(g.chatOpen && g.chatWho){
      const cur=STORY[g.pc];
      if(cur && cur[0]==='Q' && g.chatLog.length &&
         g.chatLog[g.chatLog.length-1].who===cur[1] && g.chatLog[g.chatLog.length-1].text===cur[2]){
        g.chatLog=g.chatLog.slice(0,-1);
      }
      $('#chat').classList.add('on'); $('#sprites').classList.add('chatting');
      rebuildChat();
    }else{ closeChat(); }
    closeCard();
    closeOverlay();
    $('#title').classList.add('hidden');
    $('#stage').style.display='';
    g.started=true;
    toast('读档完成');
    setTimeout(function(){ step(); },340);
    return true;
  }
  function slotMeta(slot){
    try{ const d=JSON.parse(localStorage.getItem(LS_SAVE+slot)||'null'); return d; }catch(e){ return null; }
  }
  function lastSlot(){
    let best=null,bs=-1;
    [1,2,3].forEach(function(s){ const d=slotMeta(s); if(d&&d.t>bs){bs=d.t;best=s;} });
    return best;
  }

  /* ---------- 弹层 ---------- */
  let ovTab='hist';
  function openOverlay(tab){
    ovTab=tab||'hist';
    if(!g.started && ovTab!=='cfg' && ovTab!=='endings') return;
    $('#overlay').classList.remove('hidden');
    render();
  }
  function closeOverlay(){ $('#overlay').classList.add('hidden'); }

  function render(){
    const p=$('#ovPanel');
    const tabs = '<div class="ovrow">'
      +'<button data-tab="hist" class="'+(ovTab==='hist'?'on':'')+'">回想</button>'
      +'<button data-tab="save" class="'+(ovTab==='save'?'on':'')+'">存档</button>'
      +'<button data-tab="load" class="'+(ovTab==='load'?'on':'')+'">读档</button>'
      +'<button data-tab="endings" class="'+(ovTab==='endings'?'on':'')+'">结局一览</button>'
      +'<button data-tab="cfg" class="'+(ovTab==='cfg'?'on':'')+'">设置</button>'
      +'</div>';
    let body='';
    if(ovTab==='hist'){
      const h=g.hist.slice(-80);
      body = h.length? h.map(function(x){
        const cls = x.kind==='narr'?'narr':(x.kind==='inner'?'inner':'');
        const who = x.name? '<span class="who">'+esc(x.name)+'</span>':'';
        return '<div class="logline '+cls+'">'+who+esc(x.text)+'</div>';
      }).join('') : '<div class="ovsub">还没有回想。</div>';
    }else if(ovTab==='save'||ovTab==='load'){
      body='';
      for(let s=1;s<=3;s++){
        const d=slotMeta(s);
        const meta = d? ('第 '+(d.pc+1)+' 条 · 心动 '+d.aff+' · '+(d.chapter||'')) : '空存档位';
        const time = d? ('　'+new Date(d.t).toLocaleString()) : '';
        body+='<div class="slot"><div class="sname">存档 '+s+'</div><div class="smeta">'+esc(meta)+esc(time)+'</div>'
          +(ovTab==='save'
            ? '<button data-save="'+s+'">保存</button>'
            : '<button data-load="'+s+'" '+(d?'':'disabled')+'>读取</button>')
          +'</div>';
      }
      if(g.started) body+='<div class="ovsub">提示：存档记录的是「当前正在播放的这一句」，读档后会从这一句重新播放。</div>';
    }else if(ovTab==='endings'){
      const pr=progress();
      const list=[['true',ENDINGS.true],['warm',ENDINGS.warm]];
      body = list.map(function(it){
        const got = pr.unlocked.indexOf(it[0])>=0;
        return '<div class="slot '+(got?'':'locked')+'"><div class="sname">'+(got?'已解锁':'？？？')+'</div>'
          +'<div class="smeta"><b style="color:#e8e2ff">'+it[1].title+'</b><br>'+it[1].sub+'</div></div>';
      }).join('')
      +'<div class="slot '+(pr.bonus?'':'locked')+'"><div class="sname">'+(pr.bonus?'已解锁':'？？？')+'</div>'
      +'<div class="smeta"><b style="color:#e8e2ff">彩蛋 · 一个文件夹</b><br>心动值 ≥ 16 时，在尾声之后出现。</div></div>'
      +'<div class="ovsub">历史最高心动值：'+(pr.best||0)+' / '+MAXAFF+'</div>';
    }else{
      body='<div class="ovrow"><button data-speed="26" class="'+(cfg.speed<=30?'on':'')+'">文字·快</button>'
        +'<button data-speed="48" class="'+(cfg.speed>30&&cfg.speed<=65?'on':'')+'">文字·中</button>'
        +'<button data-speed="85" class="'+(cfg.speed>65?'on':'')+'">文字·慢</button></div>'
        +'<div class="ovrow"><button data-sfx="1" class="'+(cfg.sfx?'on':'')+'">音效 开</button>'
        +'<button data-sfx="0" class="'+(cfg.sfx?'':'on')+'">音效 关</button></div>'
        +'<div class="ovsub">操作：点击画面 / 空格 / 回车 推进；自动与快进在右上角。</div>';
    }
    p.innerHTML='<h2>'+(ovTab==='hist'?'回想':ovTab==='save'?'存档':ovTab==='load'?'读档':ovTab==='endings'?'结局一览':'设置')+'</h2>'+tabs+body;
    p.scrollTop = ovTab==='hist' ? p.scrollHeight : 0;
  }
  function esc(s){ return String(s).replace(/[&<>]/g,function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;'})[c]; }); }

  /* ---------- 开始 / 返回标题 ---------- */
  function startGame(fromSave){
    g.pc=0; g.aff=0; g.flags={}; g.hist=[]; g.pos={left:null,mid:null,right:null};
    g.curBg=null; g.choice=false; g.lock=false; g.auto=false; g.skip=false; g.started=true;
    g.ending=null; g.speaker=null;
    g.chatOpen=false; g.chatWho=null; g.chatLog=[]; g.tipRow=null;
    closeChat(); closeCard();
    setAff(0);
    document.querySelectorAll('#btns button').forEach(function(b){ b.classList.remove('active'); });
    $('#title').classList.add('hidden');
    closeOverlay();
    $('#dlg').classList.add('hidden');
    $('#choices').classList.add('hidden');
    setChapter('序章');
    setTimeout(function(){ step(); },340);
  }
  function goTitle(){
    g.started=false; g.auto=false; g.skip=false;
    clearInterval(g.typeT); clearTimeout(autoT);
    closeChat(); closeCard();
    $('#title').classList.remove('hidden');
    closeOverlay();
    $('#dlg').classList.add('hidden');
    $('#choices').classList.add('hidden');
    $('#affNum').textContent='0'; $('#affBar>i').style.width='0%';
    renderSprites();
  }

  /* ---------- 事件 ---------- */
  document.addEventListener('click', function(ev){
    const t=ev.target;
    if(t.closest('#hud')||t.closest('#overlay')||t.closest('#title')||t.closest('#choices')) return;
    advance();
  });
  document.addEventListener('keydown', function(ev){
    if(ev.code==='Space'||ev.code==='Enter'||ev.code==='NumpadEnter'){
      if(!$('#overlay').classList.contains('hidden')){ closeOverlay(); return; }
      ev.preventDefault(); advance();
    }
    if(ev.code==='Escape'){
      if(!$('#overlay').classList.contains('hidden')) closeOverlay(); else openOverlay('cfg');
    }
    if(ev.key==='a'||ev.key==='A') toggleAuto();
    if(ev.key==='s'||ev.key==='S') toggleSkip();
    if(ev.key==='h'||ev.key==='H') openOverlay('hist');
  });

  function toggleAuto(){
    g.auto=!g.auto;
    document.querySelector('#btns button[data-act="auto"]').classList.toggle('active',g.auto);
    if(g.auto && !g.typing && !g.choice) advance(); else afterTyping();
  }
  function toggleSkip(){
    g.skip=!g.skip;
    document.querySelector('#btns button[data-act="skip"]').classList.toggle('active',g.skip);
    if(g.skip){ if(g.typing) finishTyping(); else advance(); }
  }

  $('#btns').addEventListener('click', function(ev){
    const b=ev.target.closest('button'); if(!b) return;
    const a=b.dataset.act;
    if(a==='auto') toggleAuto();
    else if(a==='skip') toggleSkip();
    else if(a==='hist') openOverlay('hist');
    else if(a==='save') openOverlay('save');
    else if(a==='load') openOverlay('load');
    else if(a==='cfg') openOverlay('cfg');
    else if(a==='home') goTitle();
  });
  $('#menu').addEventListener('click', function(ev){
    const b=ev.target.closest('button'); if(!b) return;
    const a=b.dataset.go;
    if(a==='start'){
      if(g.started) goTitle();
      startGame();
    }
    else if(a==='continue'){ const s=lastSlot(); if(s) doLoad(s); else toast('还没有任何存档'); }
    else if(a==='endings') openOverlay('endings');
    else if(a==='cfg') openOverlay('cfg');
  });
  $('#ovClose').addEventListener('click', closeOverlay);
  $('#ovPanel').addEventListener('click', function(ev){
    const b=ev.target.closest('button'); if(!b) return;
    if(b.dataset.tab){ ovTab=b.dataset.tab; render(); return; }
    if(b.dataset.save){ doSave(+b.dataset.save); return; }
    if(b.dataset.load){ doLoad(+b.dataset.load); return; }
    if(b.dataset.speed){ cfg.speed=+b.dataset.speed; saveCfg(); render(); return; }
    if(b.dataset.sfx){ cfg.sfx=+b.dataset.sfx===1; saveCfg(); render(); return; }
    const a=b.dataset.act;
    if(a==='endings'){ ovTab='endings'; render(); }
    else if(a==='home'){ $('#overlay').classList.add('hidden'); goTitle(); }
    else if(a==='retry'){ $('#overlay').classList.add('hidden'); goTitle(); startGame(); }
  });

  /* ---------- 启动 ---------- */
  g.curBg='classroom';
  $('#bg').className='bg s-classroom on';
  setFX(null);
  const pr=progress();
  if(pr.unlocked.length){
    const btn=document.querySelector('#menu button[data-go="endings"]');
    btn.textContent='结局一览（'+pr.unlocked.length+'/2）';
  }
  if(!lastSlot()){
    const btn=document.querySelector('#menu button[data-go="continue"]');
    btn.classList.add('locked'); btn.style.opacity='.45';
  }
  /* ---------- 调试 / 自查接口（也方便做章节直达与自动化测试） ---------- */
  window.__GAME__ = {
    STORY:STORY, LABELS:LABELS, g:g, ENDINGS:ENDINGS,
    dev:{
      step:step, jump:jump, setBG:setBG, setFX:setFX, show:show, hide:hide, advance:advance,
      expr:expr, setAff:setAff, renderSprites:renderSprites,
      save:doSave, load:doLoad, openOverlay:openOverlay, closeOverlay:closeOverlay,
      go:function(target,opts){
        opts=opts||{};
        if(!opts.keep){
          g.pc=0; g.aff=0; g.flags={}; g.hist=[]; g.pos={left:null,mid:null,right:null};
          g.curBg=null; g.ending=null; setAff(opts.aff||0);
          g.chatOpen=false; g.chatWho=null; g.chatLog=[]; g.tipRow=null; closeChat(); closeCard();
        }
        g.started=true; g.choice=false; g.lock=false; g.typing=false; g.auto=false; g.skip=false;
        $('#title').classList.add('hidden'); $('#dlg').classList.add('hidden');
        $('#choices').classList.add('hidden'); $('#chap').classList.remove('on');
        g.noCard=!!opts.noCard;
        if(typeof target==='number') g.pc=target; else jump(target);
        step();
      }
    }
  };
})();
</script>
<script id="yuzu-voice">
(function(){
  /* ---------- 合成音效（无素材） ---------- */
  var ACtX=window.AudioContext||window.webkitAudioContext, acx=null;
  function ac(){ if(!acx){ try{ acx=new ACtX(); }catch(e){ acx=null; } } return acx; }
  function tone(f,dur,vol,type){
    var c=ac(); if(!c||!SFX.on) return;
    try{
      var o=c.createOscillator(), g=c.createGain(), t=c.currentTime;
      o.type=type||'triangle'; o.frequency.value=f;
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+0.006);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+0.02);
    }catch(e){}
  }
  var SFX={on:true};
  function unlock(){ var c=ac(); if(c&&c.state==='suspended') c.resume(); }

  /* ---------- 语音（Web Speech；有 voice/ 素材就走素材） ---------- */
  var VO={on:false, rate:1.0, zh:[], pick:0};
  try{ var sv=JSON.parse(localStorage.getItem('lzyyuzu.voice')||'{}'); Object.assign(VO,sv); }catch(e){}
  function persist(){ try{ localStorage.setItem('lzyyuzu.voice', JSON.stringify({on:VO.on,rate:VO.rate,pick:VO.pick})); }catch(e){} }
  function loadVoices(){
    if(!window.speechSynthesis) return;
    VO.zh=speechSynthesis.getVoices().filter(function(v){ return /^zh/i.test(v.lang||''); });
  }
  if(window.speechSynthesis){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }

  function speak(who,text){
    if(!VO.on||!text||!window.speechSynthesis) return;
    var pc=(window.__GAME__&&window.__GAME__.g)?window.__GAME__.g.pc:0;
    /* 若放了真实语音素材：voice/<角色>_<行号>.mp3 / .ogg，优先播放 */
    var cands=['voice/'+who+'_'+pc+'.mp3','voice/'+who+'_'+pc+'.ogg'];
    (function tryNext(i){
      if(i>=cands.length){ tts(who,text); return; }
      var a=new Audio(cands[i]);
      a.volume=1;
      a.onerror=function(){ tryNext(i+1); };
      a.oncanplaythrough=function(){ try{ a.play(); }catch(e){ tts(who,text); } };
      try{ a.load(); }catch(e){ tryNext(i+1); }
      setTimeout(function(){ if(a.readyState===0) tryNext(i+1); },320);
    })(0);
  }
  function tts(who,text){
    if(!window.speechSynthesis) return;
    try{
      var u=new SpeechSynthesisUtterance(text);
      if(VO.zh.length) u.voice=VO.zh[Math.min(VO.pick,VO.zh.length-1)];
      if(who==='yunchu'){ u.pitch=1.32; u.rate=VO.rate*1.0; }
      else if(who==='haoyang'){ u.pitch=0.86; u.rate=VO.rate*0.94; }
      else if(who==='xq'){ u.pitch=1.12; u.rate=VO.rate; }
      else { u.pitch=1.0; u.rate=VO.rate*0.96; }
      speechSynthesis.cancel(); speechSynthesis.speak(u);
    }catch(e){}
  }

  /* ---------- 监听新台词 ---------- */
  var last='';
  function hook(){
    var t=document.getElementById('text'), n=document.getElementById('name');
    var dlg=document.getElementById('dlg');
    if(!t) return;
    new MutationObserver(function(){
      var s=(t.textContent||'').trim();
      if(!s||s===last) return;
      last=s;
      tone(880,0.045,0.02,'triangle');
      if(!VO.on) return;
      var who='narr';
      if(dlg && dlg.classList.contains('narr')) who='narr';
      else if(n && n.textContent) {
        var nm=n.textContent.trim();
        if(nm==='涨云初') who='yunchu'; else if(nm==='好阳') who='haoyang';
        else if(nm==='小Q') who='xq'; else if(nm) who='other';
      }
      speak(who,s);
    }).observe(t,{childList:true,characterData:true,subtree:true});
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',hook); else hook();

  /* 点击推进：轻响 + 打断当前语音 */
  document.addEventListener('click',function(ev){
    if(!ev.target.closest('#stage')) return;
    var c=ac(); if(c&&c.state==='suspended') c.resume();
    tone(620,0.035,0.016,'sine');
    if(VO.on&&window.speechSynthesis) speechSynthesis.cancel();
  },true);

  /* 选项出现：提示音 */
  new MutationObserver(function(){
    var ch=document.getElementById('choices');
    if(ch&&!ch.classList.contains('hidden')){
      tone(1046,0.1,0.03); setTimeout(function(){ tone(1397,0.13,0.026); },90);
    }
  }).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['class']});

  /* ---------- 功能条：语音开关 ---------- */
  var btns=document.getElementById('btns');
  if(btns){
    var vb=document.createElement('button'); vb.textContent='语音'; vb.dataset.act='yvoice';
    vb.className=VO.on?'active':'';
    vb.addEventListener('click',function(ev){
      ev.stopPropagation(); unlock();
      VO.on=!VO.on; vb.className=VO.on?'active':''; persist();
      if(VO.on){ tone(1180,0.07,0.03); speak('narr','语音已开启'); }
      else if(window.speechSynthesis) speechSynthesis.cancel();
    },true);
    btns.appendChild(vb);
  }

  /* ---------- 设置面板里追加语音选项 ---------- */
  function panel(){
    var p=document.getElementById('ySkin'); if(!p||p.dataset.voice) return; p.dataset.voice='1';
    var box=document.createElement('div');
    box.innerHTML='<label>语速 <span id="yv4">'+VO.rate.toFixed(2)+'</span></label>'
      +'<input id="yr4" type="range" min="0.7" max="1.3" step="0.05" value="'+VO.rate+'">'
      +'<label>音效 <span id="yv5">'+(SFX.on?'开':'关')+'</span></label>'
      +'<input id="yr5" type="range" min="0" max="1" step="1" value="'+(SFX.on?1:0)+'">'
      +'<label>语音角色</label><div id="yv6" style="font-size:12px;color:#a9b6d8">正在读取系统语音…</div>';
    p.appendChild(box);
    function list(){
      if(!window.speechSynthesis) { document.getElementById('yv6').textContent='此浏览器不支持语音合成'; return; }
      if(!VO.zh.length) loadVoices();
      document.getElementById('yv6').textContent = VO.zh.length? VO.zh.map(function(v,i){ return (i===VO.pick?'▶ ':'　')+v.name; }).join(' ／ ') : '系统里没有中文语音';
    }
    setTimeout(list,300); setTimeout(list,1200);
    box.addEventListener('input',function(ev){
      if(ev.target.id==='yr4'){ VO.rate=+ev.target.value; document.getElementById('yv4').textContent=VO.rate.toFixed(2); persist(); }
      if(ev.target.id==='yr5'){ SFX.on=+ev.target.value===1; document.getElementById('yv5').textContent=SFX.on?'开':'关'; }
    });
    box.addEventListener('click',function(ev){
      if(ev.target.id==='yv6'&&VO.zh.length){ VO.pick=(VO.pick+1)%VO.zh.length; list(); persist(); }
      ev.stopPropagation();
    });
  }
  setInterval(panel,900);
  panel();
})();
</script>
<script id="yuzu-hold">
(function(){
  var stage=document.getElementById('stage');
  var mark=document.createElement('div'); mark.id='skipMark'; mark.textContent='跳过中'; stage.appendChild(mark);

  /* ---------- 按住 Ctrl 快进，松开停止 ---------- */
  var timer=null;
  function holdTimer(){ return timer; }
  function G(){ return window.__GAME__; }
  function startHold(){
    if(timer) return;
    var g=G(); if(!g||!g.g||!g.g.started||g.g.ending) return;
    stage.classList.add('skipping');
    if(window.speechSynthesis) speechSynthesis.cancel();
    var stuck=0, lastPc=-1;
    timer=setInterval(function(){
      var g=G();
      if(!g||!g.g){ stopHold(); return; }
      if(g.g.ending||g.g.choice){ stopHold(); return; }   /* 到选项/结局就停 */
      var pc=g.g.pc;
      try{ g.dev.advance(); }catch(e){}
      if(g.g.pc===pc){
        /* advance() 被内部 lock 挡住时，走「点击画面」这条引擎真正认的路径 */
        try{ stage.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true})); }catch(e){}
      }
      if(g.g.pc===pc){ stuck++; if(stuck>120) stopHold(); } else { stuck=0; lastPc=g.g.pc; }
    }, 36);
  }
  function stopHold(){
    if(timer){ clearInterval(timer); timer=null; }
    stage.classList.remove('skipping');
  }
  document.addEventListener('keydown',function(ev){
    if(ev.key==='Control'&&!ev.repeat){ startHold(); }
  },true);
  document.addEventListener('keyup',function(ev){
    if(ev.key==='Control'){ stopHold(); }
  },true);
  window.addEventListener('blur',stopHold);
  stage.addEventListener('mouseleave',stopHold);

  /* ---------- 自检（仅用于验收：index.html?selftest=1） ---------- */
  if(/[?&]selftest=1/.test(location.search)){
    var log=[];
    setTimeout(function(){
      var b=document.querySelector('#menu button[data-go="start"]'); if(b) b.click();
      /* 热身：慢慢点 12 下，越过章节卡 */
      var n=0;
      var warm=setInterval(function(){
        stage.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true}));
        if(++n>=12){
          clearInterval(warm);
          setTimeout(function(){
            var g=G();
            log.push('热身后台: lock='+g.g.lock+', typing='+g.g.typing+', choice='+g.g.choice+', pc='+g.g.pc);
            var p1=g.g.pc;
            document.dispatchEvent(new KeyboardEvent('keydown',{key:'Control'}));
            setTimeout(function(){
              var p2=G().g.pc;
              document.dispatchEvent(new KeyboardEvent('keyup',{key:'Control'}));
              log.push('按住Ctrl 1.0s 推进='+(p2-p1)+' 行');
              setTimeout(function(){
                var p3=G().g.pc;
                log.push('松开后0.4s推进='+(p3-p2)+' 行(应0)');
                log.push('标记消失='+(!stage.classList.contains('skipping')));
                /* 对照：直接调用引擎 step() 看是否更快 */
                var p4=G().g.pc, k=0;
                for(var i=0;i<25;i++){ try{ G().dev.step(); }catch(err){} }
                log.push('dev.step()×25 推进='+(G().g.pc-p4)+' 行');
                document.title='SELFTEST | '+log.join(' | ');
              },400);
            },1000);
          },300);
        }
      },220);
    },700);
  }
  function timerRef(){ return holdTimer(); }
})();
</script>
